[package]
name = "open4x-lobby"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "open4x-lobby"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
# ── Shared (both targets) ──────────────────────────────────────────────
serde       = { workspace = true }
serde_json  = { workspace = true }
open4x-accounts = { path = "../open4x-accounts" }

# ── Server-only (native binary) ───────────────────────────────────────
axum       = { version = "0.8", optional = true, features = ["multipart"] }
image      = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
tokio      = { workspace = true, optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }
sqlx       = { version = "0.8", optional = true, features = [
    "runtime-tokio", "tls-rustls", "macros", "sqlite",
] }
chrono     = { version = "0.4", default-features = false, features = ["clock"], optional = true }
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
thiserror  = { version = "1", optional = true }
ipnet      = { version = "2", optional = true }
rust-embed = { version = "8", optional = true, features = ["axum"] }
mime_guess = { version = "2", optional = true }
# Pubkey challenge-response auth: verify Ed25519 signatures over a
# server-issued nonce. `hex` decodes the wire pubkey/signature; `rand`
# mints the challenge nonce.
ed25519-dalek = { workspace = true, optional = true }
hex        = { version = "0.4", optional = true }
rand       = { workspace = true, optional = true }

# ── Client-only (WASM frontend) ───────────────────────────────────────
leptos                  = { version = "0.7", features = ["csr"], optional = true }
wasm-bindgen            = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
js-sys                  = { version = "0.3", optional = true }
wasm-bindgen-futures    = { version = "0.4", optional = true }
web-sys                 = { version = "0.3", features = [
    "Document", "Element", "DomRect", "EventTarget", "HtmlElement",
    "Window", "Storage", "Location", "Navigator", "Clipboard", "History",
    "HtmlInputElement", "HtmlAnchorElement", "HtmlTextAreaElement",
    "Response", "Headers", "RequestInit", "Request", "RequestCredentials",
    "KeyboardEvent", "MouseEvent",
    "Blob", "File", "FileList", "FormData",
], optional = true }
serde-wasm-bindgen      = { version = "0.6", optional = true }
getrandom               = { version = "0.3", features = ["wasm_js"], optional = true }
gloo-timers             = { version = "0.3", features = ["futures"], optional = true }
send_wrapper            = { version = "0.6", optional = true }
qrcode                  = { version = "0.14", default-features = false, optional = true }

[features]
default = ["ssr"]
ssr = [
    "dep:axum", "dep:tokio", "dep:tower-http",
    "dep:sqlx", "dep:chrono", "dep:reqwest", "dep:thiserror", "dep:ipnet",
    "dep:rust-embed", "dep:mime_guess", "dep:image",
    "dep:ed25519-dalek", "dep:hex", "dep:rand",
    "open4x-accounts/persistence", "open4x-accounts/mailer-smtp",
]
csr = [
    "dep:leptos", "dep:wasm-bindgen", "dep:console_error_panic_hook",
    "dep:js-sys", "dep:wasm-bindgen-futures", "dep:web-sys",
    "dep:serde-wasm-bindgen", "dep:getrandom", "dep:gloo-timers",
    "dep:send_wrapper", "dep:qrcode",
    # Pubkey sign-in: Ed25519 keypair in the browser (seed persisted in
    # localStorage), signing the lobby's challenge nonce in pure Rust/wasm.
    "dep:ed25519-dalek", "dep:hex",
]

# Integration tests (ssr surface) — drive the API router in-process and
# sign challenges with a real Ed25519 key.
[dev-dependencies]
tower          = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ed25519-dalek  = { workspace = true }
hex            = "0.4"
serde_json     = { workspace = true }
tokio          = { workspace = true }
tempfile       = "3"
