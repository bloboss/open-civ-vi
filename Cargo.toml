[workspace]
members = [
    "libhexgrid",
    "libciv",
    "open4x-protocol",
    "open4x-sdk",
    "open4x-server",
    "open4x-client-web",
    "open4x-cli",
    "xtask",
]
# `open4x-accounts` and `open4x-lobby` are scheduled for extraction to a
# separate repo and are intentionally not workspace members. Their source
# trees remain on disk under their respective directories for that
# extraction; `cargo build -p` from within those directories still works.
exclude = [
    "open4x-accounts",
    "open4x-lobby",
]
resolver = "2"

[workspace.dependencies]
ulid = { version = "1", features = ["serde"] }
rand = "0.9"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rustyline = "15"
# OpenAPI generation. Opt-in via the `openapi` cargo feature on
# `open4x-protocol` and `open4x-server`. Default builds (including the
# wasm32 client) do not pull `utoipa` in.
utoipa = { version = "5", features = ["preserve_path_order"] }
