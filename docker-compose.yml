# Open4x full deployment stack.
#
# Services:
#   server  — game API + WebSocket engine (http://localhost:3001)
#   lobby   — landing/login/new-game wizard + auth (http://localhost:3002)
#   web     — pure-JS + WebGL2 reference client (open4x-client-js) served by
#             nginx, proxying /api + /ws to the server (http://localhost:8080)
#   cli     — CLI client pre-wired to the server
#
# Quick start:
#   docker compose build
#   docker compose up -d server lobby web
#
# Smoke-test the API + auth with curl once the stack is healthy:
#   curl -fsS localhost:3001/health           # game server
#   curl -fsS localhost:3002/health           # lobby
#   curl -fsS -XPOST localhost:3002/api/v1/auth/email/start \
#        -H 'content-type: application/json' -d '{"email":"you@example.com"}'
#   # → magic link is printed to the lobby container logs (LogMailer):
#   docker compose logs lobby | grep magic-link
#
# Attach the CLI to a running stack:
#   docker compose run --rm cli new-game --width 30 --height 18 --seed 1 \
#                                        --player Rome --ai Babylon
#   docker compose run --rm cli status yields
#   docker compose run --rm cli list units
#   docker compose run --rm cli end-turn
#   docker compose run --rm cli repl        # interactive REPL
#
# Tear down:
#   docker compose down

services:

  # ── Game server ─────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: dockerfiles/server.Dockerfile
    image: open4x-server:latest
    ports:
      # Exposed so the CLI (or curl) can also reach the API directly from
      # the host without going through nginx.
      - "3001:3001"
    volumes:
      - open4x-data:/app/data
    environment:
      PORT: "3001"
      OPEN4X_DATA_DIR: /app/data
      RUST_LOG: info
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Lobby (pre-game surface: landing / login / new-game wizard) ─────
  lobby:
    build:
      context: .
      dockerfile: dockerfiles/lobby.Dockerfile
    image: open4x-lobby:latest
    ports:
      - "3002:3002"
    volumes:
      - open4x-lobby-data:/app/data
    environment:
      PORT: "3002"
      OPEN4X_LOBBY_DATA_DIR: /app/data
      # Shared-server-multi-room orchestration: the lobby bootstraps a
      # GameRoom on this server when a user runs the new-game wizard.
      OPEN4X_GAME_SERVER_URL: "http://server:3001"
      RUST_LOG: info
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Web interface ───────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: dockerfiles/web.Dockerfile
    image: open4x-web:latest
    ports:
      - "8080:8080"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # ── CLI client ──────────────────────────────────────────────────────
  cli:
    build:
      context: .
      dockerfile: dockerfiles/cli.Dockerfile
    image: open4x-cli:latest
    depends_on:
      server:
        condition: service_healthy
    environment:
      # Picked up by the global --server flag via clap `env = ...`.
      OPEN4X_SERVER_URL: "http://server:3001"
      OPEN4X_TOKEN_FILE: /work/.open4x-session.json
    volumes:
      # Session JSON (game ID, civ ID, bearer token) persists across runs.
      - open4x-session:/work
    stdin_open: true
    tty: true
    # No default command — pass subcommand + args to `docker compose run`:
    #   docker compose run --rm cli <subcommand> [args...]

volumes:
  open4x-data:
    driver: local
  open4x-lobby-data:
    driver: local
  open4x-session:
    driver: local
