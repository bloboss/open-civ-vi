[package]
name = "open4x-protocol"
version = "0.1.0"
edition = "2024"
description = "Wire-protocol types for the open4x REST/WS API. The single source of truth for the contract between server, SDK, and any bring-your-own client."

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
ulid       = { workspace = true }
utoipa     = { workspace = true, optional = true }
# TypeScript binding generation. Opt-in via the `ts` feature; every wire
# type derives `ts_rs::TS` so `cargo xtask gen-ts` can emit the .ts bundle
# consumed by open4x-client-js (and any bring-your-own client). Off by
# default so default builds + the wasm32 client stay lean.
ts-rs      = { version = "10", optional = true }

[features]
# OpenAPI schema annotations. When enabled, every wire type derives
# `utoipa::ToSchema` so `open4x-server` (with its own `openapi` feature)
# can assemble an OpenAPI 3 document. Off by default so default builds
# (and the wasm32 client) stay lean.
openapi = ["dep:utoipa"]
# TypeScript binding generation (see the `ts-rs` dep + `cargo xtask gen-ts`).
ts = ["dep:ts-rs"]
