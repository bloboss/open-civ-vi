[package]
name = "open4x-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "open4x-server"
path = "src/main.rs"

# OpenAPI generator. Writes `book/src/multiplayer/openapi.json` from the
# Rust source. Gated behind the `openapi` feature so default builds skip
# the utoipa dep.
[[bin]]
name = "gen-openapi"
path = "src/bin/gen_openapi.rs"
required-features = ["openapi"]

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
ulid        = { workspace = true }
ed25519-dalek = { workspace = true }
rand        = { workspace = true }
open4x-protocol = { path = "../open4x-protocol" }

libciv      = { path = "../libciv" }
libhexgrid  = { path = "../libhexgrid" }
axum        = { version = "0.8", features = ["ws"] }
tokio       = { workspace = true }
dashmap     = { version = "6" }
tower-http  = { version = "0.6", features = ["cors", "fs"] }
utoipa      = { workspace = true, optional = true }

[features]
# Compile the OpenAPI metadata (annotations + `ApiDoc` struct) and the
# `gen-openapi` binary. The generated spec is committed at
# `book/src/multiplayer/openapi.json`; CI regenerates and diffs to catch
# drift.
openapi = ["dep:utoipa", "open4x-protocol/openapi"]

[dev-dependencies]
tower           = { version = "0.5", features = ["util"] }
http-body-util  = "0.1"
hex             = "0.4"
